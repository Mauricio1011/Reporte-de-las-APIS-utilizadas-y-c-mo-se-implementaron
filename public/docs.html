<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Contrato · E-Commerce Gateway</title>
    <link rel="stylesheet" href="https://unpkg.com/swagger-ui-dist@5.17.14/swagger-ui.css" />
    <style>
      body { margin: 0; }
      header { background: #241c16; color: #f6efe6; padding: 16px 24px; font-family: "Segoe UI", sans-serif; }
      header a { color: #f6efe6; }
    </style>
  </head>
  <body>
    <header>
      <strong>E-Commerce Gateway</strong>
      · <a href="/">Volver al tablero</a>

    <div id="swagger-ui"></div>
    <script src="https://unpkg.com/swagger-ui-dist@5.17.14/swagger-ui-bundle.js"></script>
    <script>
      SwaggerUIBundle({
        url: "/openapi.yaml",
        dom_id: "#swagger-ui",
        presets: [SwaggerUIBundle.presets.apis],
      });
    </script>
  </body>
</html>
